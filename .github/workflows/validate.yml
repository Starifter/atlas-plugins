name: validate

# Every entry is read the way Atlas reads it - manifest parsed, nothing
# imported - and has to pass scripts/validate.py. That check is the whole of
# what this marketplace promises about a plugin. A plugin that ships tests
# beside itself (`<name>/tests/`) has them run too; that is the plugin's own
# promise, and a marketplace is a fine place to keep it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/Starifter/atlas.git" pytest pytest-asyncio openai
      - run: python scripts/validate.py
      - run: python -m pytest
